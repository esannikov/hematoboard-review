<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920" role="img" aria-labelledby="title desc">
  <title id="title">HematoBoard architecture: deterministic control, local model inference, agentic reasoning, and clinician authority</title>
  <desc id="desc">A non-linear architecture map with grouped private-source, canonical-state, agentic-evidence, and presentation-and-review regions. Apple Vision performs local model inference. Deterministic controls bind provenance and validate projections. Bounded agents interpret source crops and synthesize an immutable candidate. The accepted ledger projects separately to a read-only dashboard and a clinician review application. Only the clinician decision can promote a new accepted revision.</desc>

  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#171717"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7650aa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#b87700"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#16857b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2c8835"/>
    </marker>
    <filter id="dashboardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#d94700" flood-opacity="0.20"/>
    </filter>
    <style>
      text { font-family: "IBM Plex Sans", Arial, sans-serif; fill: #171717; }
      .figureLabel { font-size: 24px; font-weight: 600; }
      .regionTitle { font-size: 17px; font-weight: 750; letter-spacing: 0.8px; text-anchor: middle; }
      .regionCopy { font-size: 12px; text-anchor: middle; fill: #59636e; }
      .nodeTitle { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .nodeCopy { font-size: 13.2px; text-anchor: middle; fill: #333a44; }
      .nodeCopySmall { font-size: 12.3px; text-anchor: middle; fill: #4a535d; }
      .badgeText { font-size: 10px; font-weight: 750; letter-spacing: 0.55px; text-anchor: middle; fill: #ffffff; }
      .privateRegion { fill: #f8fbff; stroke: #a8c9e7; stroke-width: 1.7; }
      .stateRegion { fill: #f8fcfb; stroke: #9accc6; stroke-width: 1.7; }
      .agentRegion { fill: #fbf9fe; stroke: #c2adda; stroke-width: 1.7; }
      .surfaceRegion { fill: #fbfcfd; stroke: #b9c7d5; stroke-width: 1.7; }
      .deterministicNode { fill: #edf6ff; stroke: #2f78bb; stroke-width: 2; }
      .modelNode { fill: #eef0ff; stroke: #5367b8; stroke-width: 2; }
      .agentNode { fill: #f4effb; stroke: #7650aa; stroke-width: 2; }
      .hybridNode { fill: #fff7e8; stroke: #b87700; stroke-width: 2; }
      .stateNode { fill: #eef8f6; stroke: #16857b; stroke-width: 2; }
      .humanNode { fill: #eef8ea; stroke: #2c8835; stroke-width: 2; }
      .sourceNode { fill: #f4f5f6; stroke: #66707b; stroke-width: 2; }
      .surfaceNode { fill: #eff6fb; stroke: #527a9f; stroke-width: 2; }
      .dashboardNode { fill: #fff2e8; stroke: #d94700; stroke-width: 4; filter: url(#dashboardShadow); }
      .deterministicBadge { fill: #2f78bb; }
      .modelBadge { fill: #5367b8; }
      .agentBadge { fill: #7650aa; }
      .hybridBadge { fill: #b87700; }
      .stateBadge { fill: #16857b; }
      .humanBadge { fill: #2c8835; }
      .sourceBadge { fill: #66707b; }
      .surfaceBadge { fill: #527a9f; }
      .dashboardBadge { fill: #d94700; }
      .dashboardTitle { font-size: 21px; font-weight: 800; text-anchor: middle; fill: #8f2d00; }
      .flow { fill: none; stroke: #171717; stroke-width: 2.4; marker-end: url(#arrowBlack); }
      .branch { fill: none; stroke: #527a9f; stroke-width: 2.5; marker-end: url(#arrowBlack); }
      .purpleLoop { fill: none; stroke: #7650aa; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrowPurple); }
      .amberLoop { fill: none; stroke: #b87700; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrowAmber); }
      .tealLoop { fill: none; stroke: #16857b; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrowTeal); }
      .greenFlow { fill: none; stroke: #2c8835; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .flowLabel { font-size: 12px; font-weight: 650; letter-spacing: 0.15px; }
      .purpleText { fill: #7650aa; }
      .amberText { fill: #9b6500; }
      .tealText { fill: #16857b; }
      .greenText { fill: #2c8835; }
      .surfaceText { fill: #527a9f; }
    </style>
  </defs>

  <rect width="1440" height="1920" fill="#ffffff"/>
  <text x="36" y="42" class="figureLabel">HEMATOBOARD · controlled architecture · 2026-08-08</text>

  <!-- Orchestration is agentic; promotion authority remains outside the agent. -->
  <rect x="50" y="68" width="1340" height="120" rx="8" class="agentNode"/>
  <rect x="68" y="84" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="109" y="100" class="badgeText">AGENTIC</text>
  <text x="720" y="130" class="nodeTitle">AI AGENT ORCHESTRATOR</text>
  <text x="720" y="158" class="nodeCopy">Chooses the next permitted operation, calls tools and bounded agents, and records receipts.</text>
  <text x="720" y="179" class="nodeCopySmall">It cannot approve clinical facts or publish an accepted revision.</text>

  <!-- ArXiv-style grouped system regions. -->
  <rect x="45" y="220" width="430" height="780" rx="16" class="privateRegion"/>
  <text x="260" y="255" class="regionTitle" fill="#2f78bb">PRIVATE SOURCE PROCESSING</text>
  <text x="260" y="278" class="regionCopy">Local pages → verified, de-identified structured source data</text>

  <rect x="965" y="220" width="430" height="830" rx="16" class="agentRegion"/>
  <text x="1180" y="255" class="regionTitle" fill="#7650aa">AGENTIC REASONING + EVIDENCE</text>
  <text x="1180" y="278" class="regionCopy">Bounded agents build traceable claims from facts and reviewed sources</text>

  <rect x="495" y="650" width="450" height="1035" rx="16" class="stateRegion"/>
  <text x="720" y="686" class="regionTitle" fill="#16857b">CANONICAL STATE + DETERMINISTIC CONTROL</text>
  <text x="720" y="710" class="regionCopy">Accepted facts, candidate reasoning and rendered views stay separate</text>

  <rect x="965" y="1080" width="430" height="605" rx="16" class="surfaceRegion"/>
  <text x="1180" y="1116" class="regionTitle" fill="#527a9f">PRESENTATION + CLINICIAN REVIEW</text>
  <text x="1180" y="1140" class="regionCopy">Dashboard displays; review app records clinician decisions</text>

  <!-- Private source-processing region. -->
  <rect x="70" y="290" width="380" height="130" rx="6" class="deterministicNode"/>
  <rect x="86" y="306" width="104" height="22" rx="11" class="deterministicBadge"/>
  <text x="138" y="322" class="badgeText">DETERMINISTIC</text>
  <text x="260" y="356" class="nodeTitle">PRIVATE INTAKE</text>
  <text x="260" y="385" class="nodeCopy">Creates an isolated workspace and inventories all pages.</text>
  <text x="260" y="406" class="nodeCopySmall">Keeps the original; records hashes and phase time.</text>

  <rect x="70" y="460" width="380" height="145" rx="6" class="modelNode"/>
  <rect x="86" y="476" width="96" height="22" rx="11" class="modelBadge"/>
  <text x="134" y="492" class="badgeText">LOCAL MODEL</text>
  <text x="260" y="527" class="nodeTitle">APPLE VISION OCR</text>
  <text x="260" y="558" class="nodeCopy">Reads text, confidence and word positions locally.</text>
  <text x="260" y="583" class="nodeCopySmall">Keeps the original PDF as the pixel source of truth.</text>

  <rect x="70" y="645" width="380" height="145" rx="6" class="deterministicNode"/>
  <rect x="86" y="661" width="104" height="22" rx="11" class="deterministicBadge"/>
  <text x="138" y="677" class="badgeText">DETERMINISTIC</text>
  <text x="260" y="712" class="nodeTitle">STRUCTURE + DE-IDENTIFICATION</text>
  <text x="260" y="743" class="nodeCopy">Rebuilds rows as test, result, unit and reference.</text>
  <text x="260" y="768" class="nodeCopySmall">Removes identifiers without changing source geometry.</text>

  <rect x="70" y="830" width="380" height="145" rx="6" class="hybridNode"/>
  <rect x="86" y="846" width="72" height="22" rx="11" class="hybridBadge"/>
  <text x="122" y="862" class="badgeText">HYBRID</text>
  <text x="260" y="898" class="nodeTitle">SOURCE REVIEW</text>
  <text x="260" y="929" class="nodeCopy">Terra reads only privacy-screened source crops.</text>
  <text x="260" y="954" class="nodeCopySmall">Consensus closes a field; disagreement reopens review.</text>

  <!-- Agentic evidence region. -->
  <rect x="990" y="290" width="380" height="140" rx="6" class="sourceNode"/>
  <rect x="1006" y="306" width="72" height="22" rx="11" class="sourceBadge"/>
  <text x="1042" y="322" class="badgeText">SOURCE</text>
  <text x="1180" y="356" class="nodeTitle">EXTERNAL EVIDENCE</text>
  <text x="1180" y="387" class="nodeCopy">Finds literature and guidance for narrow case questions.</text>
  <text x="1180" y="412" class="nodeCopySmall">Keeps version, location, licence and scope for every claim.</text>

  <rect x="990" y="470" width="380" height="145" rx="6" class="hybridNode"/>
  <rect x="1006" y="486" width="72" height="22" rx="11" class="hybridBadge"/>
  <text x="1042" y="502" class="badgeText">HYBRID</text>
  <text x="1180" y="538" class="nodeTitle">EVIDENCE REVIEW</text>
  <text x="1180" y="569" class="nodeCopy">Checks source meaning and case applicability.</text>
  <text x="1180" y="594" class="nodeCopySmall">A search hit or PMID alone is never accepted evidence.</text>

  <rect x="990" y="690" width="380" height="150" rx="6" class="agentNode"/>
  <rect x="1006" y="706" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="1047" y="722" class="badgeText">AGENTIC</text>
  <text x="1180" y="762" class="nodeTitle">CONTROLLED AI AGENT SYNTHESIS</text>
  <text x="1180" y="798" class="nodeCopy">Builds a candidate argument from accepted facts.</text>
  <text x="1180" y="823" class="nodeCopySmall">Then broadens, grounds, reconciles and challenges each claim.</text>

  <rect x="990" y="890" width="380" height="140" rx="6" class="stateNode"/>
  <rect x="1006" y="906" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="1039" y="922" class="badgeText">STATE</text>
  <text x="1180" y="958" class="nodeTitle">IMMUTABLE CANDIDATE</text>
  <text x="1180" y="989" class="nodeCopy">Stores hypotheses, evidence links and explicit gaps.</text>
  <text x="1180" y="1014" class="nodeCopySmall">Write-once: it never overwrites the accepted ledger.</text>

  <!-- Canonical state and deterministic projection region. -->
  <rect x="525" y="745" width="390" height="145" rx="6" class="stateNode"/>
  <rect x="541" y="761" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="574" y="777" class="badgeText">STATE</text>
  <text x="720" y="813" class="nodeTitle">ACCEPTED EVIDENCE LEDGER</text>
  <text x="720" y="847" class="nodeCopy">Canonical accepted measurements, dates and findings.</text>
  <text x="720" y="874" class="nodeCopySmall">Agents can read; only controlled promotion creates a revision.</text>

  <rect x="525" y="1130" width="390" height="145" rx="6" class="deterministicNode"/>
  <rect x="541" y="1146" width="104" height="22" rx="11" class="deterministicBadge"/>
  <text x="593" y="1162" class="badgeText">DETERMINISTIC</text>
  <text x="720" y="1198" class="nodeTitle">PROJECTION + DOM CLOSURE</text>
  <text x="720" y="1233" class="nodeCopy">Builds every view from ledger and candidate data.</text>
  <text x="720" y="1259" class="nodeCopySmall">Any rendered mismatch blocks clinician review.</text>

  <rect x="525" y="1320" width="390" height="180" rx="8" class="dashboardNode"/>
  <rect x="541" y="1336" width="168" height="22" rx="11" class="dashboardBadge"/>
  <text x="625" y="1352" class="badgeText">PRIMARY PUBLIC OUTPUT</text>
  <text x="720" y="1388" class="dashboardTitle">HEMATOBOARD DASHBOARD</text>
  <text x="720" y="1418" class="nodeCopy">Shows the accepted case and separate reasoning candidate.</text>
  <text x="720" y="1448" class="nodeCopySmall">Overview · Timeline · Graph · never writes clinical state.</text>
  <text x="720" y="1478" class="nodeCopySmall">esannikov.github.io/hematoboard/</text>

  <rect x="525" y="1540" width="390" height="125" rx="6" class="stateNode"/>
  <rect x="541" y="1556" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="574" y="1572" class="badgeText">STATE</text>
  <text x="720" y="1608" class="nodeTitle">ACCEPTED REVISION</text>
  <text x="720" y="1637" class="nodeCopy">Stores approved changes as a new hash-pinned state.</text>
  <text x="720" y="1657" class="nodeCopySmall">Dependent reasoning becomes stale for the next cycle.</text>

  <!-- Presentation and clinician-review region. -->
  <rect x="990" y="1180" width="380" height="145" rx="6" class="surfaceNode"/>
  <rect x="1006" y="1196" width="76" height="22" rx="11" class="surfaceBadge"/>
  <text x="1044" y="1212" class="badgeText">SURFACE</text>
  <text x="1180" y="1248" class="nodeTitle">CLINICIAN REVIEW APP</text>
  <text x="1180" y="1280" class="nodeCopy">Opens source-linked candidate changes for inspection.</text>
  <text x="1180" y="1305" class="nodeCopySmall">Records actions but cannot decide clinical truth.</text>

  <rect x="990" y="1365" width="380" height="135" rx="6" class="humanNode"/>
  <rect x="1006" y="1381" width="72" height="22" rx="11" class="humanBadge"/>
  <text x="1042" y="1397" class="badgeText">HUMAN</text>
  <text x="1180" y="1433" class="nodeTitle">CLINICIAN DECISION</text>
  <text x="1180" y="1462" class="nodeCopy">The clinician inspects evidence and proposed changes.</text>
  <text x="1180" y="1485" class="nodeCopySmall">Only they can accept, correct, reject or defer.</text>

  <rect x="990" y="1540" width="380" height="125" rx="6" class="stateNode"/>
  <rect x="1006" y="1556" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="1039" y="1572" class="badgeText">STATE</text>
  <text x="1180" y="1608" class="nodeTitle">DEFER / REJECT</text>
  <text x="1180" y="1637" class="nodeCopy">Keeps candidate, evidence and rationale for audit.</text>
  <text x="1180" y="1657" class="nodeCopySmall">The accepted case state remains unchanged.</text>

  <!-- Primary dependencies and explicit branches. -->
  <path d="M260 420 V455" class="flow"/>
  <path d="M260 605 V640" class="flow"/>
  <path d="M260 790 V825" class="flow"/>
  <path d="M450 902 H490 V817 H520" class="flow"/>
  <path d="M1180 430 V465" class="flow"/>
  <path d="M1180 615 V685" class="flow"/>
  <path d="M915 817 H950 V765 H985" class="flow"/>
  <path d="M1180 840 V885" class="flow"/>
  <path d="M1180 1030 V1070 H940 V1202 H920" class="flow"/>

  <!-- One validated projection, two different destinations. -->
  <path d="M720 1275 V1315" class="branch"/>
  <text x="742" y="1302" class="flowLabel surfaceText">publish dashboard</text>
  <path d="M915 1202 H950 V1252 H985" class="branch"/>
  <path d="M1180 1325 V1360" class="flow"/>

  <path d="M990 1432 H955 V1602 H920" class="greenFlow"/>
  <text x="944" y="1589" class="flowLabel greenText" text-anchor="end">accept / correct</text>
  <path d="M1180 1500 V1535" class="flow"/>

  <!-- Real feedback loops. -->
  <path d="M70 902 H28 V718 H65" class="amberLoop"/>
  <text x="20" y="820" class="flowLabel amberText" transform="rotate(-90 20 820)">targeted correction</text>

  <path d="M1370 960 H1410 V542 H1375" class="purpleLoop"/>
  <text x="1426" y="770" class="flowLabel purpleText" transform="rotate(-90 1426 770)">new evidence question</text>

  <path d="M525 1602 H478 V720 H570 V740" class="tealLoop"/>
  <text x="466" y="1182" class="flowLabel tealText" transform="rotate(-90 466 1182)">new hash-pinned cycle</text>

  <!-- Cross-cutting deterministic receipt plane. -->
  <rect x="50" y="1720" width="1340" height="120" rx="8" class="deterministicNode"/>
  <rect x="68" y="1736" width="104" height="22" rx="11" class="deterministicBadge"/>
  <text x="120" y="1752" class="badgeText">DETERMINISTIC</text>
  <text x="720" y="1768" class="nodeTitle">APPEND-ONLY RECEIPT PLANE</text>
  <text x="720" y="1798" class="nodeCopy">Records input/output hashes, privacy checks, agent results, tool actions and phase time.</text>
  <text x="720" y="1822" class="nodeCopySmall">Corrections create new receipts; prior history is never silently rewritten.</text>

  <!-- Compact legend. -->
  <rect x="50" y="1880" width="16" height="16" class="deterministicNode"/><text x="74" y="1893" font-size="12">deterministic control</text>
  <rect x="220" y="1880" width="16" height="16" class="modelNode"/><text x="244" y="1893" font-size="12">local model</text>
  <rect x="354" y="1880" width="16" height="16" class="agentNode"/><text x="378" y="1893" font-size="12">agentic</text>
  <rect x="458" y="1880" width="16" height="16" class="hybridNode"/><text x="482" y="1893" font-size="12">hybrid verification</text>
  <rect x="628" y="1880" width="16" height="16" class="stateNode"/><text x="652" y="1893" font-size="12">state / artifact</text>
  <rect x="766" y="1880" width="16" height="16" class="humanNode"/><text x="790" y="1893" font-size="12">human authority</text>
  <rect x="920" y="1880" width="16" height="16" class="surfaceNode"/><text x="944" y="1893" font-size="12">review surface</text>
  <rect x="1046" y="1880" width="16" height="16" class="dashboardNode"/><text x="1070" y="1893" font-size="12">dashboard output</text>
  <line x1="1214" y1="1888" x2="1249" y2="1888" class="purpleLoop"/><text x="1261" y="1893" font-size="12">feedback cycle</text>
</svg>
