<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100" role="img" aria-labelledby="title desc">
  <title id="title">HematoBoard controlled synthesis protocol 2.0 architecture</title>
  <desc id="desc">One HematoBoard router resolves a CaseScope and one explicit mode: view, intake, data revision, source review, evidence review, controlled synthesis, projection, clinician review or audit. Private intake and source review produce an accepted evidence ledger. Four separately recorded passes—breadth, grounding, reconciliation and independent critique—feed a deterministic method-conformance gate. A complete immutable candidate is published before a detached projection check. The Material dashboard remains read-only. Only a recorded clinician decision can promote a new accepted revision.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#222222"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6750a4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1f7a45"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#087c73"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#6750a4" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: "IBM Plex Sans", Arial, sans-serif; fill: #202124; }
      .figureLabel { font-size: 24px; font-weight: 650; }
      .region { stroke-width: 1.8; }
      .regionTitle { font-size: 17px; font-weight: 760; letter-spacing: 0.8px; text-anchor: middle; }
      .regionCopy { font-size: 12.5px; text-anchor: middle; fill: #5c6370; }
      .node { stroke-width: 2; }
      .nodeTitle { font-size: 19px; font-weight: 730; text-anchor: middle; }
      .nodeCopy { font-size: 13.2px; text-anchor: middle; fill: #343943; }
      .nodeCopySmall { font-size: 12.2px; text-anchor: middle; fill: #555d68; }
      .badgeText { font-size: 10px; font-weight: 760; letter-spacing: 0.55px; text-anchor: middle; fill: #ffffff; }
      .flow { fill: none; stroke: #222222; stroke-width: 2.4; marker-end: url(#arrow); }
      .flowPurple { fill: none; stroke: #6750a4; stroke-width: 2.6; marker-end: url(#arrowPurple); }
      .flowGreen { fill: none; stroke: #1f7a45; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .loop { fill: none; stroke: #087c73; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrowTeal); }
      .flowLabel { font-size: 12px; font-weight: 650; }
      .router { fill: #f2ecff; stroke: #6750a4; }
      .privateRegion { fill: #f8fbff; stroke: #9fc3e5; }
      .stateRegion { fill: #f6fbfa; stroke: #8cc7c1; }
      .protocolRegion { fill: #fbf8ff; stroke: #c3addf; }
      .reasonRegion { fill: #faf8fe; stroke: #bca8da; }
      .sourceNode { fill: #f3f5f7; stroke: #69727d; }
      .controlNode { fill: #edf6ff; stroke: #2f78bb; }
      .stateNode { fill: #edf8f6; stroke: #087c73; }
      .agentNode { fill: #f3edfb; stroke: #6750a4; }
      .hybridNode { fill: #fff7e6; stroke: #b36b00; }
      .humanNode { fill: #eef8eb; stroke: #1f7a45; }
      .surfaceNode { fill: #eef5fb; stroke: #4e779d; }
      .dashboardNode { fill: #f5f0ff; stroke: #6750a4; stroke-width: 3.5; filter: url(#shadow); }
      .routerBadge, .agentBadge { fill: #6750a4; }
      .controlBadge { fill: #2f78bb; }
      .stateBadge { fill: #087c73; }
      .hybridBadge { fill: #b36b00; }
      .humanBadge { fill: #1f7a45; }
      .surfaceBadge { fill: #4e779d; }
      .sourceBadge { fill: #69727d; }
    </style>
  </defs>

  <rect width="1440" height="2100" fill="#ffffff"/>
  <text x="36" y="42" class="figureLabel">HEMATOBOARD · controlled synthesis protocol 2.0 · 2026-08-11</text>

  <!-- One operational entry point and one case identity. -->
  <rect x="50" y="68" width="1340" height="150" rx="24" class="node router"/>
  <rect x="70" y="86" width="92" height="22" rx="11" class="routerBadge"/>
  <text x="116" y="102" class="badgeText">ONE ROUTER</text>
  <text x="720" y="130" class="nodeTitle">HEMATOBOARD ROUTER + CASESCOPE</text>
  <text x="720" y="155" class="nodeCopy">Binds mode, case key, case ID, bundle hash, revision and operation ID.</text>
  <text x="720" y="180" class="nodeCopySmall">view · intake · data_revision · source_review · evidence_review · controlled_synthesis · projection · clinician_review · audit</text>
  <text x="720" y="202" class="nodeCopySmall">It can orchestrate work; it cannot approve clinical truth or promote accepted state.</text>

  <!-- Three authority regions. -->
  <rect x="45" y="230" width="430" height="565" rx="22" class="region privateRegion"/>
  <text x="260" y="264" class="regionTitle" fill="#2f78bb">PRIVATE SOURCE PROCESSING</text>
  <text x="260" y="287" class="regionCopy">Raw material stays local; only verified de-identified structure crosses the boundary</text>

  <rect x="505" y="230" width="420" height="565" rx="22" class="region stateRegion"/>
  <text x="715" y="264" class="regionTitle" fill="#087c73">ACCEPTED CLINICAL STATE</text>
  <text x="715" y="287" class="regionCopy">One versioned evidence ledger; no agent-owned clinical canon</text>

  <rect x="955" y="230" width="440" height="565" rx="22" class="region protocolRegion"/>
  <text x="1175" y="264" class="regionTitle" fill="#6750a4">METHOD + EXTERNAL EVIDENCE</text>
  <text x="1175" y="287" class="regionCopy">Versioned protocol, reviewed sources and deterministic self-check</text>

  <!-- Private source path. -->
  <rect x="70" y="315" width="380" height="120" rx="12" class="node controlNode"/>
  <rect x="88" y="331" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="140" y="347" class="badgeText">DETERMINISTIC</text>
  <text x="260" y="382" class="nodeTitle">PRIVATE INTAKE</text>
  <text x="260" y="410" class="nodeCopy">Inventory, source hashes, page identity and phase receipts.</text>

  <rect x="70" y="475" width="380" height="120" rx="12" class="node controlNode"/>
  <rect x="88" y="491" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="140" y="507" class="badgeText">LOCAL + RULED</text>
  <text x="260" y="542" class="nodeTitle">OCR + STRUCTURE</text>
  <text x="260" y="570" class="nodeCopy">Text, geometry and typed rows retain exact source addresses.</text>

  <rect x="70" y="635" width="380" height="130" rx="12" class="node hybridNode"/>
  <rect x="88" y="651" width="72" height="22" rx="11" class="hybridBadge"/>
  <text x="124" y="667" class="badgeText">HYBRID</text>
  <text x="260" y="704" class="nodeTitle">DE-IDENTIFY + SOURCE REVIEW</text>
  <text x="260" y="732" class="nodeCopy">Privacy, field consensus and targeted human exceptions.</text>
  <text x="260" y="753" class="nodeCopySmall">Raw PDFs, identifiers and licensed text remain private.</text>

  <!-- Accepted state and controlled input. -->
  <rect x="530" y="315" width="370" height="150" rx="12" class="node stateNode"/>
  <rect x="548" y="331" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="581" y="347" class="badgeText">STATE</text>
  <text x="715" y="382" class="nodeTitle">ACCEPTED EVIDENCE LEDGER</text>
  <text x="715" y="412" class="nodeCopy">Versioned observations, facts, dates and provenance.</text>
  <text x="715" y="438" class="nodeCopySmall">Canonical case_bundle.json · clinician authority preserved.</text>

  <rect x="530" y="515" width="370" height="150" rx="12" class="node controlNode"/>
  <rect x="548" y="531" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="600" y="547" class="badgeText">DETERMINISTIC</text>
  <text x="715" y="582" class="nodeTitle">FRESHNESS + BREADTH INPUT</text>
  <text x="715" y="612" class="nodeCopy">Pins the clinical input hash and builds a shielded projection.</text>
  <text x="715" y="638" class="nodeCopySmall">Excludes prior H#, ranks, relations, work-up, interpretations and literature.</text>

  <rect x="530" y="705" width="370" height="60" rx="12" class="node stateNode"/>
  <text x="715" y="742" class="nodeCopy">Any accepted change makes the prior candidate stale.</text>

  <!-- Protocol and evidence controls. -->
  <rect x="980" y="315" width="390" height="130" rx="12" class="node agentNode"/>
  <rect x="998" y="331" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="1039" y="347" class="badgeText">PROTOCOL</text>
  <text x="1175" y="382" class="nodeTitle">SYNTHESIS PROTOCOL 2.0</text>
  <text x="1175" y="411" class="nodeCopy">Declares pass order, schemas, required files and gates.</text>
  <text x="1175" y="433" class="nodeCopySmall">One canonical skill · one runner · one publisher.</text>

  <rect x="980" y="485" width="390" height="130" rx="12" class="node controlNode"/>
  <rect x="998" y="501" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="1050" y="517" class="badgeText">SELF-CHECK</text>
  <text x="1175" y="552" class="nodeTitle">METHOD READINESS</text>
  <text x="1175" y="581" class="nodeCopy">Validates router, protocol, schemas, tools and CaseScope.</text>
  <text x="1175" y="603" class="nodeCopySmall">A failed check blocks synthesis before an agent pass starts.</text>

  <rect x="980" y="655" width="390" height="110" rx="12" class="node sourceNode"/>
  <rect x="998" y="671" width="72" height="22" rx="11" class="sourceBadge"/>
  <text x="1034" y="687" class="badgeText">SOURCES</text>
  <text x="1175" y="720" class="nodeTitle">REVIEWED EVIDENCE CORPUS</text>
  <text x="1175" y="747" class="nodeCopy">Stable E-CAND IDs, scope, licence and proposition receipts.</text>

  <!-- Explicit four-pass synthesis. -->
  <rect x="45" y="835" width="1350" height="285" rx="22" class="region reasonRegion"/>
  <text x="720" y="872" class="regionTitle" fill="#6750a4">FOUR SEPARATELY RECORDED REASONING PASSES</text>
  <text x="720" y="895" class="regionCopy">Each receipt records input/output hashes, execution identity, prompt hash, tools, budget and events</text>

  <rect x="70" y="925" width="290" height="155" rx="14" class="node agentNode"/>
  <rect x="88" y="941" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="129" y="957" class="badgeText">PASS 1</text>
  <text x="215" y="995" class="nodeTitle">BREADTH</text>
  <text x="215" y="1024" class="nodeCopy">Wide differential, must-not-miss</text>
  <text x="215" y="1047" class="nodeCopy">alternatives and open questions.</text>
  <text x="215" y="1068" class="nodeCopySmall">No old synthesis or external literature.</text>

  <rect x="405" y="925" width="290" height="155" rx="14" class="node agentNode"/>
  <rect x="423" y="941" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="464" y="957" class="badgeText">PASS 2</text>
  <text x="550" y="995" class="nodeTitle">GROUNDING</text>
  <text x="550" y="1024" class="nodeCopy">Narrow questions, accepted and</text>
  <text x="550" y="1047" class="nodeCopy">rejected sources, claim mappings.</text>
  <text x="550" y="1068" class="nodeCopySmall">Final search round must prove saturation.</text>

  <rect x="740" y="925" width="290" height="155" rx="14" class="node agentNode"/>
  <rect x="758" y="941" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="799" y="957" class="badgeText">PASS 3</text>
  <text x="885" y="995" class="nodeTitle">RECONCILIATION</text>
  <text x="885" y="1024" class="nodeCopy">Maps every old and new H#:</text>
  <text x="885" y="1047" class="nodeCopy">retain, add, merge, rerank, deactivate.</text>
  <text x="885" y="1068" class="nodeCopySmall">Identifiers are never silently reassigned.</text>

  <rect x="1075" y="925" width="290" height="155" rx="14" class="node agentNode"/>
  <rect x="1093" y="941" width="82" height="22" rx="11" class="agentBadge"/>
  <text x="1134" y="957" class="badgeText">PASS 4</text>
  <text x="1220" y="995" class="nodeTitle">INDEPENDENT CRITIC</text>
  <text x="1220" y="1024" class="nodeCopy">Tests anchoring, closure, weak evidence,</text>
  <text x="1220" y="1047" class="nodeCopy">missing alternatives and overclaiming.</text>
  <text x="1220" y="1068" class="nodeCopySmall">Distinct execution; critical issues block finalize.</text>

  <!-- Method gate, immutable candidate and detached projection. -->
  <rect x="160" y="1165" width="1120" height="135" rx="18" class="node controlNode"/>
  <rect x="180" y="1181" width="118" height="22" rx="11" class="controlBadge"/>
  <text x="239" y="1197" class="badgeText">METHOD GATE</text>
  <text x="720" y="1227" class="nodeTitle">FAIL-CLOSED METHOD CONFORMANCE</text>
  <text x="720" y="1256" class="nodeCopy">Checks exact pass order, files, hashes, saturation, source coverage, critic independence and unresolved critical issues.</text>
  <text x="720" y="1280" class="nodeCopySmall">Boolean claims alone do not establish that the method ran.</text>

  <rect x="70" y="1350" width="600" height="150" rx="18" class="node stateNode"/>
  <rect x="90" y="1366" width="66" height="22" rx="11" class="stateBadge"/>
  <text x="123" y="1382" class="badgeText">STATE</text>
  <text x="370" y="1418" class="nodeTitle">IMMUTABLE CANDIDATE REVISION</text>
  <text x="370" y="1448" class="nodeCopy">Input snapshots · four pass receipts · candidate draft · manifest · audit chain.</text>
  <text x="370" y="1474" class="nodeCopySmall">Write-once and candidate-only; never overwrites the accepted ledger.</text>

  <rect x="770" y="1350" width="600" height="150" rx="18" class="node controlNode"/>
  <rect x="790" y="1366" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="842" y="1382" class="badgeText">DETACHED</text>
  <text x="1070" y="1418" class="nodeTitle">PROJECTION + DOM CLOSURE</text>
  <text x="1070" y="1448" class="nodeCopy">Static source-of-truth test and real-browser audit after candidate publication.</text>
  <text x="1070" y="1474" class="nodeCopySmall">Receipt binds candidate and build hashes; failure cannot rewrite the run.</text>

  <!-- Human-facing destinations and authority. -->
  <rect x="45" y="1545" width="1350" height="390" rx="22" fill="#fbfcfd" stroke="#b7c6d5" stroke-width="1.8"/>
  <text x="720" y="1582" class="regionTitle" fill="#4e779d">PRESENTATION + CLINICIAN AUTHORITY</text>
  <text x="720" y="1605" class="regionCopy">The dashboard displays; the review application records; only the clinician decides</text>

  <rect x="70" y="1640" width="380" height="145" rx="18" class="node dashboardNode"/>
  <rect x="88" y="1656" width="104" height="22" rx="11" class="agentBadge"/>
  <text x="140" y="1672" class="badgeText">READ-ONLY</text>
  <text x="260" y="1707" class="nodeTitle">MATERIAL DASHBOARD</text>
  <text x="260" y="1737" class="nodeCopy">Accepted ledger + visibly separate candidate.</text>
  <text x="260" y="1761" class="nodeCopySmall">Overview · Timeline · Graph · Data · Gaps</text>

  <rect x="530" y="1640" width="380" height="145" rx="18" class="node surfaceNode"/>
  <rect x="548" y="1656" width="76" height="22" rx="11" class="surfaceBadge"/>
  <text x="586" y="1672" class="badgeText">REVIEW</text>
  <text x="720" y="1707" class="nodeTitle">CLINICIAN REVIEW APP</text>
  <text x="720" y="1737" class="nodeCopy">Opens candidate changes with sources and limits.</text>
  <text x="720" y="1761" class="nodeCopySmall">No automatic clinical action.</text>

  <rect x="990" y="1640" width="380" height="145" rx="18" class="node humanNode"/>
  <rect x="1008" y="1656" width="72" height="22" rx="11" class="humanBadge"/>
  <text x="1044" y="1672" class="badgeText">HUMAN</text>
  <text x="1180" y="1707" class="nodeTitle">CLINICIAN DECISION</text>
  <text x="1180" y="1737" class="nodeCopy">Accept · correct · reject · defer.</text>
  <text x="1180" y="1761" class="nodeCopySmall">Only a recorded action can promote accepted state.</text>

  <rect x="285" y="1825" width="410" height="90" rx="16" class="node stateNode"/>
  <text x="490" y="1861" class="nodeTitle">NEW ACCEPTED REVISION</text>
  <text x="490" y="1890" class="nodeCopySmall">Parent hash preserved; dependent reasoning becomes stale.</text>

  <rect x="745" y="1825" width="410" height="90" rx="16" class="node sourceNode"/>
  <text x="950" y="1861" class="nodeTitle">REJECT / DEFER</text>
  <text x="950" y="1890" class="nodeCopySmall">Candidate, evidence and rationale remain in audit history.</text>

  <!-- Primary dependencies. -->
  <path d="M260 435 V470" class="flow"/>
  <path d="M260 595 V630" class="flow"/>
  <path d="M450 700 H490 V390 H525" class="flow"/>
  <path d="M715 465 V510" class="flow"/>
  <path d="M1175 445 V480" class="flow"/>
  <path d="M715 665 V805 H215 V920" class="flowPurple"/>
  <path d="M1175 615 V805 H550 V920" class="flowPurple"/>
  <path d="M360 1002 H400" class="flowPurple"/>
  <path d="M695 1002 H735" class="flowPurple"/>
  <path d="M1030 1002 H1070" class="flowPurple"/>
  <path d="M720 1120 V1160" class="flow"/>
  <path d="M720 1300 V1325 H370 V1345" class="flow"/>
  <path d="M670 1425 H765" class="flow"/>
  <path d="M1070 1500 V1525 H260 V1635" class="flow"/>
  <path d="M1070 1500 V1530 H720 V1635" class="flow"/>
  <path d="M910 1712 H985" class="flowGreen"/>
  <path d="M1115 1785 C1000 1788 700 1802 490 1820" class="flowGreen"/>
  <path d="M1245 1785 C1200 1790 1050 1805 950 1820" class="flow"/>
  <path d="M285 1870 H20 V131 H45" class="loop"/>
  <text x="34" y="1120" class="flowLabel" fill="#087c73" transform="rotate(-90 34 1120)">new hash-pinned cycle</text>

  <!-- Cross-cutting receipt plane. -->
  <rect x="50" y="1960" width="1340" height="105" rx="18" class="node controlNode"/>
  <rect x="70" y="1976" width="104" height="22" rx="11" class="controlBadge"/>
  <text x="122" y="1992" class="badgeText">APPEND-ONLY</text>
  <text x="720" y="2018" class="nodeTitle">RECEIPT PLANE</text>
  <text x="720" y="2047" class="nodeCopy">CaseScope · protocol · input/output hashes · prompts · models · tools · privacy · decisions · phase time</text>
</svg>
