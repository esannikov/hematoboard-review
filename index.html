    <!--
      THESIS: HematoBoard is an attention rail feeding one evidence stage; it refuses the undifferentiated wall of equal panels.
      OWN-WORLD: IBM Carbon discipline with IBM Plex Sans, a 48px UI shell, square productive layers, precise rules, and semantic clinical state colour.
      STORY: Select a case, see the decisive clinical question first, then move through dated facts, competing hypotheses, provenance, and audit depth without changing the underlying bundle.
      FIRST VIEWPORT: Compact brand, case and palette controls sit above a two-tier route; the active evidence surface begins immediately below with its question, boundary, and primary action visible.
      FORM: Attention rail + evidence stage, grounded structure 6, seed ee50f56c.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
